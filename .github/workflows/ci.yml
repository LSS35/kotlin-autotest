name: "🚀 CI & 🦄 Allure Report"

on:
  push:
    branches: ['*']
  # 1. Added pull_request so checks appear inside your GitHub PR tab
  pull_request:
    branches: ['*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 2. Replaced old actions/cache with official Gradle action (caches wrapper + deps automatically)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 3. Code formatting check (with clean output & no daemon overhead)
      - name: Check code formatting
        run: ./gradlew spotlessCheck --no-daemon --console=plain

      # 4. Run unit and API tests
      - name: Run tests
        run: ./gradlew test --no-daemon --console=plain

      # 5. Cache Allure CLI binary
      - name: Cache Allure CLI
        id: cache-allure-cli
        uses: actions/cache@v4
        with:
          path: allure-2.27.0
          key: allure-2.27.0-${{ runner.os }}

      - name: Download Allure CLI
        if: steps.cache-allure-cli.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure-2.27.0.tgz

      - name: Add Allure CLI to PATH
        run: echo "$(pwd)/allure-2.27.0/bin" >> $GITHUB_PATH

      # 6. Generate Allure Report
      - name: Generate Allure Report
        run: |
          allure generate build/allure-results --clean -o build/allure-report

      # 7. Upload Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/allure-report

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4