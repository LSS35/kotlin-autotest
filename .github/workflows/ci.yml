name: "🚀 CI & 🦄 Allure Report"

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Caches Gradle Wrapper & dependencies automatically
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 1. Verify code formatting rules with Spotless & ktlint
      - name: Check code formatting
        run: ./gradlew spotlessCheck --no-daemon --console=plain

      # 2. Execute unit and API tests
      - name: Run tests
        run: ./gradlew test --no-daemon --console=plain

      # 3. Cache Allure CLI binary to speed up workflow execution
      - name: Cache Allure CLI
        id: cache-allure-cli
        uses: actions/cache@v4
        with:
          path: allure-2.27.0
          key: allure-2.27.0-${{ runner.os }}

      - name: Download Allure CLI
        if: steps.cache-allure-cli.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure-2.27.0.tgz

      - name: Add Allure CLI to PATH
        run: echo "$(pwd)/allure-2.27.0/bin" >> $GITHUB_PATH

      # 4. Generate Allure HTML Report
      - name: Generate Allure Report
        run: |
          allure generate build/allure-results --clean -o build/allure-report

      # 5. Store generated report as artifact to pass it to the deploy job
      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: build/allure-report
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Using a custom environment name bypasses default branch restrictions while preserving the URL badge!
    environment:
      name: Allure Reports
      url: https://lss35.github.io/kotlin-autotest/${{ steps.branch.outputs.name }}/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Download generated Allure HTML report from the build job
      - name: Download Allure report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: ./build/allure-report

      # 2. Sanitize branch name (supports both push and pull_request events)
      - name: Sanitize branch name
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF_NAME="${{ github.head_ref }}"
          else
            REF_NAME="${{ github.ref_name }}"
          fi
          echo "name=$(echo ${REF_NAME} | sed 's/\//-/g')" >> $GITHUB_OUTPUT

      # 3. Deploy Allure report into branch-specific subdirectory on GitHub Pages
      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/allure-report
          destination_dir: ${{ steps.branch.outputs.name }}
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'